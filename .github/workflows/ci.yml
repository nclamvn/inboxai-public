name: Phase 2 quality and security

on:
  pull_request:
  push:
    branches: [phase2/m0-security-baseline-20261111, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        command: [lint, typecheck, 'test:unit', 'test:integration', build]
    env:
      # Synthetic build-only values. Never use repository production secrets.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-build-anon-key
      SUPABASE_SERVICE_ROLE_KEY: synthetic-build-service-key
      OPENAI_API_KEY: sk-synthetic-build-only
      ANTHROPIC_API_KEY: sk-ant-synthetic-build-only
      RESEND_API_KEY: re_synthetic_build_only
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run ${{ matrix.command }}

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-test-password
          POSTGRES_DB: inboxai_security_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:synthetic-test-password@127.0.0.1:5432/inboxai_security_test

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      # Private backports require exact-source, regression and upstream-advisory checks.
      - run: npm run audit:picomatch
        env:
          INBOXAI_ADVISORY_TOKEN: ${{ github.token }}
      # Keep the reviewed dependency baseline from regressing.
      - run: npm audit --audit-level=moderate

  local-auth-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: docker compose -f tests/local-auth/compose.yml pull
      - run: npm run test:local-auth
      - if: always()
        run: docker compose -p inboxai-m0e-local -f tests/local-auth/compose.yml down

  purchase-release-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: google-chrome --version
      - name: Pull pinned fixture images
        run: >-
          docker compose
          -f tests/local-auth/compose.yml
          -f tests/local-auth/e2e.compose.yml
          -f tests/local-auth/purchase-release.compose.yml
          pull
      - name: Pull visual and platform fixture images
        run: >-
          docker compose
          -f tests/local-auth/compose.yml
          -f tests/local-auth/e2e.compose.yml
          pull
      - run: npm run test:purchase-release
      - run: npm run test:design -- --isolated
      - run: npm run test:platform -- --isolated
      - run: npm run test:purchase-study
      - name: Purchase value pilot (manual first)
        run: npm run test:purchase-value
      - name: Purchase value pilot (InboxAI first)
        run: npm run test:purchase-value -- --bundle-b
      - name: Upload synthetic Chrome evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purchase-release-chrome
          path: |
            test-results/purchase-release/report.json
            test-results/purchase-release/browser.json
            test-results/purchase-release/*.png
            test-results/local-pilot/study/report.json
            test-results/local-pilot/study/*.png
            test-results/local-pilot/study/value/report.json
            test-results/local-pilot/study/value/browser.json
            test-results/local-pilot/study/value/*.png
            test-results/local-pilot/study/value/reverse/report.json
            test-results/local-pilot/study/value/reverse/browser.json
            test-results/local-pilot/study/value/reverse/*.png
            test-results/m6d/design-run.json
            test-results/m6d/design/
            test-results/commitment-attention/platform/
          retention-days: 7
